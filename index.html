<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Vagas 2026/2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800" x-data="dashboardData()" x-init="initData()">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-950">Controle de Vagas</h1>
                    <p class="text-xs text-slate-500">Vestibular 2026/2</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <span class="text-xs text-slate-400">Última atualização</span>
                <p class="text-sm font-semibold text-slate-700" x-text="ultimaAtualizacao">Carregando...</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <template x-if="loading">
            <div class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
                <p class="text-slate-500 mt-2 text-sm">Carregando informações da planilha...</p>
            </div>
        </template>

        <template x-if="!loading">
            <div class="space-y-8">
                <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i class="fa-solid fa-graduation-cap text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Vagas Ofertadas</p>
                            <h3 class="text-2xl font-bold text-slate-900" x-text="getKpis().vagas">0</h3>
                            <span class="text-xs text-slate-400" x-text="getKpis().vagasSub">Subtítulo</span>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="p-3 bg-purple-50 text-purple-600 rounded-xl"><i class="fa-solid fa-users text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">Inscrições Totais</p>
                            <h3 class="text-2xl font-bold text-slate-900" x-text="getKpis().inscricoes">0</h3>
                            <span class="text-xs text-purple-600 font-semibold" x-text="getKpis().demanda">Demanda</span>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl"><i class="fa-solid fa-user-check text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium" x-text="getKpis().sucessoLabel">Sucesso</p>
                            <h3 class="text-2xl font-bold text-slate-900" x-text="getKpis().sucessoValor">0</h3>
                            <span class="text-xs text-emerald-600 font-semibold" x-text="getKpis().taxaSucesso">Taxa</span>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
                        <div class="p-3 bg-amber-50 text-amber-600 rounded-xl"><i class="fa-solid fa-bullhorn text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium" x-text="getKpis().apoioLabel">Status</p>
                            <h3 class="text-2xl font-bold text-slate-900" x-text="getKpis().apoioValor">0</h3>
                            <span class="text-xs text-slate-400" x-text="getKpis().apoioSub">Subtítulo</span>
                        </div>
                    </div>
                </section>

                <div class="border-b border-slate-200">
                    <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                        <button @click="tab = 'vestibular'" :class="tab === 'vestibular' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-150">
                            <i class="fa-solid fa-user-graduate mr-2"></i>Vagas Vestibular
                        </button>
                        <button @click="tab = 'cebas'" :class="tab === 'cebas' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-150">
                            <i class="fa-solid fa-hand-holding-heart mr-2"></i>Vagas CEBAS
                        </button>
                        <button @click="tab = 'geral'" :class="tab === 'geral' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-150">
                            <i class="fa-solid fa-globe mr-2"></i>Visão Geral Combinada
                        </button>
                        <button @click="tab = 'transferencia'" :class="tab === 'transferencia' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-150">
                            <i class="fa-solid fa-right-from-bracket mr-2 rotate-180"></i>Vagas Transferência / Ajustes
                        </button>
                    </nav>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" x-model="search" placeholder="Buscar por curso..." class="pl-10 pr-4 py-2 w-full border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>
                    <div class="flex gap-2">
                        <button @click="filtroPeriodo = ''" :class="filtroPeriodo === '' ? 'bg-slate-900 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'" class="px-4 py-2 rounded-lg text-xs font-semibold transition">Todos</button>
                        <button @click="filtroPeriodo = 'Noturno'" :class="filtroPeriodo === 'Noturno' ? 'bg-slate-900 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'" class="px-4 py-2 rounded-lg text-xs font-semibold transition">Noturno</button>
                        <button @click="filtroPeriodo = 'Matutino'" :class="filtroPeriodo === 'Matutino' ? 'bg-slate-900 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'" class="px-4 py-2 rounded-lg text-xs font-semibold transition">Matutino</button>
                        <button @click="filtroPeriodo = 'Ead'" :class="filtroPeriodo === 'Ead' ? 'bg-slate-900 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'" class="px-4 py-2 rounded-lg text-xs font-semibold transition">EaD</button>
                    </div>
                </div>

                <div x-show="tab === 'vestibular'">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="py-4 px-6">Curso</th>
                                        <th class="py-4 px-4">Período</th>
                                        <th class="py-4 px-4 text-center">Vagas Vestibular</th>
                                        <th class="py-4 px-4 text-center">Inscrições</th>
                                        <th class="py-4 px-4 text-center">Convocados</th>
                                        <th class="py-4 px-4 text-center">Pagos</th>
                                        <th class="py-4 px-4 text-center">Ocupação (Vest.)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    <template x-for="item in filteredList" :key="item.curso + item.periodo">
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-4 px-6 font-semibold text-slate-900" x-text="item.curso"></td>
                                            <td class="py-4 px-4">
                                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700" x-text="item.periodo"></span>
                                            </td>
                                            <td class="py-4 px-4 text-center font-medium text-slate-700" x-text="item.vagasVestibular"></td>
                                            <td class="py-4 px-4 text-center text-slate-600" x-text="item.inscritosVestibular"></td>
                                            <td class="py-4 px-4 text-center text-slate-600" x-text="item.convocados"></td>
                                            <td class="py-4 px-4 text-center text-emerald-600 font-semibold" x-text="item.pagos"></td>
                                            <td class="py-4 px-4 text-center">
                                                <div class="flex items-center justify-center space-x-2">
                                                    <div class="w-16 bg-slate-100 rounded-full h-2">
                                                        <div class="bg-indigo-500 h-2 rounded-full" :style="`width: ${Math.min((item.pagos / (item.vagasVestibular || 1)) * 100, 100)}%`"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 font-medium" x-text="item.vagasVestibular > 0 ? Math.round((item.pagos / item.vagasVestibular) * 100) + '%' : '0%'"></span>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div x-show="tab === 'cebas'">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="py-4 px-6">Curso</th>
                                        <th class="py-4 px-4">Período</th>
                                        <th class="py-4 px-4 text-center">Vagas CEBAS</th>
                                        <th class="py-4 px-4 text-center">Inscrições (Bolsa)</th>
                                        <th class="py-4 px-4 text-center">Classificados</th>
                                        <th class="py-4 px-4 text-center">Lista de Espera</th>
                                        <th class="py-4 px-4 text-center">Doc. em Análise</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    <template x-for="item in filteredList" :key="item.curso + item.periodo">
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-4 px-6 font-semibold text-slate-900" x-text="item.curso"></td>
                                            <td class="py-4 px-4">
                                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-50 text-rose-700" x-text="item.periodo"></span>
                                            </td>
                                            <td class="py-4 px-4 text-center font-medium text-slate-700" x-text="item.vagasCebas"></td>
                                            <td class="py-4 px-4 text-center text-slate-600" x-text="item.inscritosCebas"></td>
                                            <td class="py-4 px-4 text-center text-emerald-600 font-semibold" x-text="item.classificadosCebas"></td>
                                            <td class="py-4 px-4 text-center text-amber-600 font-medium" x-text="item.listaEsperaCebas"></td>
                                            <td class="py-4 px-4 text-center text-slate-500" x-text="item.docAnaliseCebas"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div x-show="tab === 'geral'">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="py-4 px-6">Curso</th>
                                        <th class="py-4 px-4">Período</th>
                                        <th class="py-4 px-4 text-center">Vagas Vestibular</th>
                                        <th class="py-4 px-4 text-center">Vagas CEBAS</th>
                                        <th class="py-4 px-4 text-center">Vagas Totais</th>
                                        <th class="py-4 px-4 text-center">Total Inscrições</th>
                                        <th class="py-4 px-4 text-center">Total Matriculados</th>
                                        <th class="py-4 px-4 text-center">Ocupação Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    <template x-for="item in filteredList" :key="item.curso + item.periodo">
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-4 px-6 font-semibold text-slate-900" x-text="item.curso"></td>
                                            <td class="py-4 px-4">
                                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700" x-text="item.periodo"></span>
                                            </td>
                                            <td class="py-4 px-4 text-center text-indigo-600 font-medium" x-text="item.vagasVestibular"></td>
                                            <td class="py-4 px-4 text-center text-rose-600 font-medium" x-text="item.vagasCebas"></td>
                                            <td class="py-4 px-4 text-center font-bold text-slate-900" x-text="item.totalVagas"></td>
                                            <td class="py-4 px-4 text-center text-slate-600 font-medium" x-text="item.inscritosVestibular + item.inscritosCebas"></td>
                                            <td class="py-4 px-4 text-center text-emerald-600 font-bold" x-text="item.matriculados"></td>
                                            <td class="py-4 px-4 text-center">
                                                <div class="flex items-center justify-center space-x-2">
                                                    <div class="w-16 bg-slate-100 rounded-full h-2">
                                                        <div class="bg-emerald-500 h-2 rounded-full" :style="`width: ${Math.min((item.matriculados / (item.totalVagas || 1)) * 100, 100)}%`"></div>
                                                    </div>
                                                    <span class="text-xs text-slate-500 font-medium" x-text="item.totalVagas > 0 ? Math.round((item.matriculados / item.totalVagas) * 100) + '%' : '0%'"></span>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div x-show="tab === 'transferencia'">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="py-4 px-6">Curso</th>
                                        <th class="py-4 px-4">Período</th>
                                        <th class="py-4 px-4 text-center">Ajuste de Vagas (Qtd)</th>
                                        <th class="py-4 px-6">Observação Oficial da Planilha</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    <template x-for="item in filteredList" :key="item.curso + item.periodo">
                                        <tr class="hover:bg-slate-50/80 transition" :class="item.vagasMovimentadas !== 0 ? 'bg-amber-50/40' : ''">
                                            <td class="py-4 px-6 font-semibold text-slate-900" x-text="item.curso"></td>
                                            <td class="py-4 px-4">
                                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700" x-text="item.periodo"></span>
                                            </td>
                                            <td class="py-4 px-4 text-center font-bold" :class="item.vagasMovimentadas < 0 ? 'text-rose-600' : (item.vagasMovimentadas > 0 ? 'text-emerald-600' : 'text-slate-400')" x-text="item.vagasMovimentadas > 0 ? '+' + item.vagasMovimentadas : item.vagasMovimentadas"></td>
                                            <td class="py-4 px-6 text-slate-600 italic text-xs" x-text="item.observacao || 'Nenhuma alteração registrada'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            Controle de Vagas - Vestibular 2026/2.
        </div>
    </footer>

    <script>
        // Exemplo: Insira no topo do seu <script> ou logo acima da função de renderização
const cursosOcultosPorProcesso = {
  "Vestibular": [
    "Ciência da Computação - Matutino",
    "Ciência de Dados e Inteligência Artificial - Noturno",
    "Engenharia de Software - Matutino",
    "Gestão de Negócios Imobiliários - Ead",
    "Segurança da Informação - Noturno"
  ],
  "CEBAS": [
    // Cursos do CEBAS que deseja ocultar
  ]
};
        function dashboardData() {
            return {
                tab: 'vestibular',
                search: '',
                filtroPeriodo: '',
                loading: true,
                ultimaAtualizacao: '',
                vagasList: [],

                initData() {
                    // Busca dinamicamente o arquivo data.json atualizado pelo Apps Script
                    fetch('data.json?t=' + new Date().getTime())
                        .then(response => response.json())
                        .then(data => {
                            this.ultimaAtualizacao = data.lastUpdated || '';
                            
                            this.vagasList = (data.vagasList || [])
                                .filter(item => item["Curso"] && item["Curso"] !== "Totais" && !item["Curso"].includes("Ultima atualização"))
                                .map(item => ({
                                    curso: item["Curso"],
                                    periodo: item["Período"],
                                    vagasVestibular: Number(item["Vagas\nVestibular"] || item["Vagas Vestibular"]) || 0,
                                    vagasCebas: Number(item["Vagas\nCEBAS"] || item["Vagas CEBAS"]) || 0,
                                    totalVagas: Number(item["Vagas\nTotal"] || item["Vagas Total"]) || 0,
                                    inscritosVestibular: Number(item["Inscrições\n(vestibular)"] || item["Inscrições (vestibular)"]) || 0,
                                    inscritosCebas: Number(item["Inscrições\n(CEBAS)"] || item["Inscrições (CEBAS)"]) || 0,
                                    convocados: Number(item["Convocados"]) || 0,
                                    pagos: Number(item["Pagos"]) || 0,
                                    classificadosCebas: Number(item["Aprovados\n(CEBAS)"] || item["Classificados\n(CEBAS)"]) || 0,
                                    listaEsperaCebas: Number(item["Lista de espera\n(CEBAS)"]) || 0,
                                    docAnaliseCebas: Number(item["Doc. em análise\n(CEBAS)"]) || 0,
                                    matriculados: Number(item["Matriculados"]) || 0,
                                    vagasMovimentadas: Number(item["Transferência\nInterna"] || item["Transferência Interna"]) || 0,
                                    observacao: item["Observação"] || ''
                                }));

                            this.loading = false;
                        })
                        .catch(err => {
                            console.error("Erro ao carregar data.json:", err);
                            this.loading = false;
                        });
                },

                get filteredList() {
                    return this.vagasList.filter(item => {
                        const matchesSearch = item.curso.toLowerCase().includes(this.search.toLowerCase());
                        const matchesPeriodo = this.filtroPeriodo === '' || item.periodo === this.filtroPeriodo;
                        return matchesSearch && matchesPeriodo;
                    });
                },

                getKpis() {
                    const list = this.filteredList;
                    if (this.tab === 'vestibular') {
                        const vagas = list.reduce((sum, item) => sum + item.vagasVestibular, 0);
                        const inscricoes = list.reduce((sum, item) => sum + item.inscritosVestibular, 0);
                        const pagos = list.reduce((sum, item) => sum + item.pagos, 0);
                        const convocados = list.reduce((sum, item) => sum + item.convocados, 0);
                        const demanda = vagas > 0 ? (inscricoes / vagas).toFixed(1) : 0;
                        const taxaSucesso = convocados > 0 ? Math.round((pagos / convocados) * 100) : 0;

                        return {
                            vagas: vagas.toLocaleString(),
                            vagasSub: 'Ingresso por Vestibular Tradicional',
                            inscricoes: inscricoes.toLocaleString(),
                            demanda: `${demanda}x cand / vaga`,
                            sucessoLabel: 'Matrículas Pagas',
                            sucessoValor: pagos.toLocaleString(),
                            taxaSucesso: `${taxaSucesso}% conv. matriculados`,
                            apoioLabel: 'Convocados',
                            apoioValor: convocados.toLocaleString(),
                            apoioSub: 'Aguardando ação'
                        };
                    } else if (this.tab === 'cebas') {
                        const vagas = list.reduce((sum, item) => sum + item.vagasCebas, 0);
                        const inscricoes = list.reduce((sum, item) => sum + item.inscritosCebas, 0);
                        const classificados = list.reduce((sum, item) => sum + item.classificadosCebas, 0);
                        const listaEspera = list.reduce((sum, item) => sum + item.listaEsperaCebas, 0);
                        const demanda = vagas > 0 ? (inscricoes / vagas).toFixed(1) : 0;
                        const taxaSucesso = inscricoes > 0 ? Math.round((classificados / inscricoes) * 100) : 0;

                        return {
                            vagas: vagas.toLocaleString(),
                            vagasSub: 'Bolsas Assistenciais CEBAS',
                            inscricoes: inscricoes.toLocaleString(),
                            demanda: `${demanda}x cand / vaga`,
                            sucessoLabel: 'Classificados (Bolsa)',
                            sucessoValor: classificados.toLocaleString(),
                            taxaSucesso: `${taxaSucesso}% de aproveitamento`,
                            apoioLabel: 'Em Lista de Espera',
                            apoioValor: listaEspera.toLocaleString(),
                            apoioSub: 'Aguardando classificação'
                        };
                    } else if (this.tab === 'geral') {
                        const vagas = list.reduce((sum, item) => sum + item.totalVagas, 0);
                        const inscricoes = list.reduce((sum, item) => sum + (item.inscritosVestibular + item.inscritosCebas), 0);
                        const matriculados = list.reduce((sum, item) => sum + item.matriculados, 0);
                        const convocados = list.reduce((sum, item) => sum + item.convocados, 0);
                        const demanda = vagas > 0 ? (inscricoes / vagas).toFixed(1) : 0;
                        const taxaOcupacao = vagas > 0 ? Math.round((matriculados / vagas) * 100) : 0;

                        return {
                            vagas: vagas.toLocaleString(),
                            vagasSub: 'Total Combinado (Geral)',
                            inscricoes: inscricoes.toLocaleString(),
                            demanda: `${demanda}x cand / vaga total`,
                            sucessoLabel: 'Matriculados Totais',
                            sucessoValor: matriculados.toLocaleString(),
                            taxaSucesso: `${taxaOcupacao}% de ocupação geral`,
                            apoioLabel: 'Total Convocados',
                            apoioValor: convocados.toLocaleString(),
                            apoioSub: 'Processo seletivo ativo'
                        };
                    } else {
                        const totalVagasAfetadas = list.reduce((sum, item) => sum + Math.abs(item.vagasMovimentadas), 0);
                        const balancoLiquido = list.reduce((sum, item) => sum + item.vagasMovimentadas, 0);
                        
                        return {
                            vagas: totalVagasAfetadas.toLocaleString(),
                            vagasSub: 'Vagas Remanejadas / Alteradas',
                            inscricoes: '-',
                            demanda: 'N/A',
                            sucessoLabel: 'Balanço Líquido (Saldo)',
                            sucessoValor: balancoLiquido >= 0 ? `+${balancoLiquido}` : balancoLiquido.toLocaleString(),
                            taxaSucesso: 'Vagas subtraídas ou adicionadas',
                            apoioLabel: 'Cursos Alterados',
                            apoioValor: list.filter(item => item.vagasMovimentadas !== 0).length.toString(),
                            apoioSub: 'Cursos com observações'
                        };
                    }
                }
            };
        }
    </script>
</body>
</html>
